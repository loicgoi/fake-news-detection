services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    command: ["serve"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fake-news-app
    ports:
      - "8501:8501"
    depends_on:
      - ollama
    environment:
      - OLLAMA_API_BASE=http://ollama:11434
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - .:/app
      - .:/chroma_db:/app/chroma_db
      - .:/data:/app/data
    command: >
      sh -c "
        # Attendre qu'Ollama soit prêt
        echo 'Waiting for Ollama server...'
        sleep 45
        
        # Télécharger les modèles en utilisant l'API REST directement
        echo 'Downloading models via API...'
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"all-minilm:latest\"}'
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"llama3.2:1b\"}'
        
        # Démarrer Streamlit
        echo 'Starting Streamlit...'
        cd /app && streamlit run app/app.py --server.port=8501 --server.address=0.0.0.0
      "

volumes:
  ollama_data:

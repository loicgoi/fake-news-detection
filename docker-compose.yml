services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - fake-news-net

  app:
    build: .
    container_name: fake-news-app
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_API_BASE=http://ollama:11434
      - OLLAMA_HOST=0.0.0.0
      - PYTHONPATH=/app
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
      - ./test_ollama.py:/app/test_ollama.py  # 🔍 Montage du script de test
    depends_on:
      - ollama
    networks:
      - fake-news-net
    command: >
      sh -c "
        echo 'Attente du démarrage complet d Ollama...' &&
        sleep 30 &&
        echo 'Téléchargement des modèles...' &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"all-minilm:latest\"}' &&
        echo 'Modèle all-minilm téléchargé' &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"llama3.2:1b\"}' &&
        echo 'Modèle llama3.2 téléchargé' &&
        echo '' &&
        echo '🔍 LANCEMENT DU TEST DE CONNECTIVITÉ...' &&
        /app/.venv/bin/python /app/test_ollama.py &&
        echo '' &&
        echo 'Lancement de l application...' &&
        /app/.venv/bin/streamlit run app/app.py --server.port=8501 --server.address=0.0.0.0
      "

volumes:
  ollama_data:
